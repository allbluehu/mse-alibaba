# 自定义配置
app:
  jwt:
    secret: "mySecretKeyForJWTTokenGeneration2023WithSpringBoot318"
    issuer: "gateway-service"
  gateway:
    auth:
      exclude-paths:
        - "/auth/api/auth/login"
        - "/auth/api/auth/sms/send"
        - "/auth/api/auth/refresh"
        - "/auth/api/auth/logout"
        - "/product/api/public/**"
        - "/user/api/public/**"
        - "/actuator/**"
        - "/v3/api-docs/**"
        - "/swagger-ui/**"
        - "/swagger-resources/**"
        - "/webjars/**"
    rate-limit:
      enabled: true
      default-replenish-rate: 10
      default-burst-capacity: 20

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,routes
      cors:
        allowed-origins: "*"
        allowed-methods: GET,POST
  endpoint:
    health:
      show-details: always
      show-components: always
    gateway:
      enabled: true

# 日志配置
logging:
  level:
    com.example.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
  pattern:
    level: "%5p [%15.15t] %-40.40logger{39} : %m%n"