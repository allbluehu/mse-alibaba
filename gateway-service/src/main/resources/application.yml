server:
  port: 8080

spring:
  application:
    name: gateway-service

  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP
        # 导入共享配置
        extension-configs:
          - data-id: common.yaml
            group: DEFAULT_GROUP
            refresh: true

    # Gateway 配置
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # 全局跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "http://localhost:*"
              - "https://*.example.com"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

      # 路由配置
      routes:
        # 认证服务路由
        - id: auth-service
          uri: https://gitee.com
          predicates:
            - Path=/auth/api/**
