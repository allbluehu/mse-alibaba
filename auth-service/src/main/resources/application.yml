server:
  port: 8081
  servlet:
    context-path: /auth

spring:
  application:
    name: auth-service

#  config:
#    import:
#      - optional:nacos:${spring.application.name}.yml
#      - optional:nacos:common.yml
#
#  cloud:
#    nacos:
#      discovery:
#        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
#        namespace: ${NACOS_NAMESPACE:}
#        group: ${NACOS_GROUP:DEFAULT_GROUP}
#      config:
#        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
#        namespace: ${NACOS_NAMESPACE:}
#        group: ${NACOS_GROUP:DEFAULT_GROUP}
#        file-extension: yaml
#        refresh-enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/oidc_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10
          min-idle: 0

  security:
    oauth2:
      authorizationserver:
        endpoint:
          oidc:
            user-info:
              enabled: true
        client:
          web-app:
            registration:
              client-id: web-app
              client-secret: "{bcrypt}$2a$10$your_hashed_secret"
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - http://localhost:8080/login/oauth2/code/web-app
              scopes:
                - openid
                - profile
                - email
                - read
                - write
              require-authorization-consent: true

  session:
    timeout: 86400 # 24小时
    redis:
      namespace: spring:session:oidc
      flush-mode: on_save

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html


logging:
  level:
    com.example.authserver: DEBUG
    org.springframework.security: INFO
    org.springframework.security.oauth2: DEBUG
  file:
    name: logs/oidc-auth-server.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# 自定义配置
app:
  oidc:
    issuer: http://localhost:9000/auth
    # 微信配置
    wechat:
      app-id: ${WECHAT_APP_ID:你的微信AppID}
      app-secret: ${WECHAT_APP_SECRET:你的微信AppSecret}
    # 抖音配置
    douyin:
      client-key: ${DOUYIN_CLIENT_KEY:你的抖音ClientKey}
      client-secret: ${DOUYIN_CLIENT_SECRET:你的抖音ClientSecret}
  security:
    token:
      access-token-ttl: 1800 # 30分钟
      refresh-token-ttl: 86400 # 1天

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      cors:
        allowed-origins: "*"
        allowed-methods: GET,POST
  endpoint:
    health:
      show-details: always
      show-components: always
